      offers.forEach(function (o, x) { var p = 'o' + (x + 1); set(p + 'title', o.title); set(p + 'price', o.price); set(p + 'link', o.link); set(p + 'sold', o.sold); });
      S.offers = offers.length;
    }
    set('income', oneOf(j.monthlyIncome, INCOME));
    set('sources', known(j.clientSources, SOURCES, 3));
    set('journey', j.journey); set('stuck', j.stuck);
    var c = j.community || {};
    if (str(c.name)) {
      set('cname', c.name); set('clink', c.link); set('caccess', accessOf(c.access)); set('ccost', c.cost);
      set('cmembers', oneOf(c.members, MEMBERS)); set('cactive', oneOf(c.weeklyActive, ACTIVE)); set('cpath', known([c.leadsToOffers], PATH, 1)[0]); set('cheavy', c.heavy);
    }
    set('mprice', j.price); set('mseen', j.seen);
    var rc = String(j.receive == null ? '' : j.receive).match(/\d+/); if (rc && +rc[0] >= 1 && +rc[0] <= 10) set('mreceive', String(+rc[0]));
    set('wand', j.wand); set('change', j.change); set('hours', oneOf(j.hours, HOURS));
    URL_KEYS.forEach(function (k) { if (has(k)) normUrl(k); });
    return n;
  }
  function copyText(text, ok, fail) {
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(text).then(ok, fail); return; }
    } catch (e) { /* fall through */ }
    fail();
  }

  /* ---------- confetti for the thank you page ---------- */
  function confetti() {
    try { if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return; } catch (e) { /* fine */ }
    var cv = document.createElement('canvas'); cv.className = 'confetti'; cv.setAttribute('aria-hidden', 'true');
    document.body.appendChild(cv);
    var ctx = cv.getContext && cv.getContext('2d'); if (!ctx) { cv.parentNode.removeChild(cv); return; }
    var dpr = Math.min(window.devicePixelRatio || 1, 2), W = 0, H = 0;
    var size = function () { W = window.innerWidth; H = window.innerHeight; cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); };
    size(); window.addEventListener('resize', size);
    var COLORS = ['#e8c47a', '#f3d89b', '#c9a3ff', '#f4b6c8', '#ffffff', '#8fd6cc', '#7b3fa0'];
    var bits = [], k;
    for (k = 0; k < 170; k++) bits.push({
      x: W / 2 + (Math.random() - 0.5) * W * 0.3, y: H * 0.32 + (Math.random() - 0.5) * 40,
      vx: (Math.random() - 0.5) * 13, vy: -Math.random() * 13 - 4,
      w: 6 + Math.random() * 7, h: 4 + Math.random() * 5, r: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.3,
      c: COLORS[k % COLORS.length], round: Math.random() < 0.3, wob: Math.random() * 10
    });
    var start = Date.now();
    var tick = function () {
      var t = Date.now() - start;
      ctx.clearRect(0, 0, W, H);
      var alive = 0;
      bits.forEach(function (b) {
        b.vy += 0.26; b.vx *= 0.985; b.vy *= 0.99; b.x += b.vx + Math.sin((t / 260) + b.wob) * 0.6; b.y += b.vy; b.r += b.vr;
        if (b.y < H + 20) alive++;
        ctx.save(); ctx.globalAlpha = t > 3600 ? Math.max(0, 1 - (t - 3600) / 900) : 1;
        ctx.translate(b.x, b.y); ctx.rotate(b.r); ctx.fillStyle = b.c;
        if (b.round) { ctx.beginPath(); ctx.arc(0, 0, b.h / 2 + 1, 0, Math.PI * 2); ctx.fill(); }
        else ctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h * Math.abs(Math.cos(b.r * 2)) + 1);
        ctx.restore();
      });
      if (alive && t < 4500) window.requestAnimationFrame(tick);
      else { window.removeEventListener('resize', size); if (cv.parentNode) cv.parentNode.removeChild(cv); }
    };
    window.requestAnimationFrame(tick);
  }

  /* ---------- checking answers ---------- */
  function communityStarted() { return has('cname') || has('clink') || has('caccess'); }
  function check(k, errs, groupMode) {
    var f = F[k]; if (!shown(k)) return;
    var need = isReq(f) || (groupMode && f.gr);
    if (f.type === 'image' || f.type === 'check') return;
    if (f.type === 'choice' || f.type === 'multi' || f.type === 'scale') { if (need && !has(k)) errs[k] = 'Please pick one.'; return; }
    var v = String(val(k)).trim();
    if (need && !v) { errs[k] = f.type === 'time' ? 'Please add your birth time, or check the box if you\'re not sure.' : 'Please fill this in.'; return; }
    if (v && f.type === 'email' && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) errs[k] = 'That email doesn\'t look right. Mind checking it?';
    if (v && f.type === 'url') { normUrl(k); if (!okUrl(val(k))) errs[k] = 'That link doesn\'t look right. Mind checking it?'; }
    if (v && f.type === 'date' && v > todayStr()) errs[k] = 'That date hasn\'t happened yet. Mind checking it?';
  }
  function validate() {
    var st = cur(), errs = {}, i;
    if (st.id === 'business') {
      for (i = 1; i <= S.offers; i++) OFFER_SFX.forEach(function (s) { check('o' + i + s, errs, true); });
      st.keys.forEach(function (k) { check(k, errs, false); });
    } else if (st.id === 'community') {
      var started = communityStarted();
      st.keys.forEach(function (k) { check(k, errs, started); });
    } else if (st.id === 'review') {
      if (!S.consent) errs.consent = 'Please check this box so I can start your audit.';
    } else st.keys.forEach(function (k) { check(k, errs, false); });
    return errs;
  }
  function showErrors(errs) {
    S.errors = errs; render(false);
    var k = Object.keys(errs)[0];
    var box = k === 'consent' ? document.getElementById('consent') : document.querySelector('[data-field="' + k + '"]');
    if (box) { var inp = box.matches && box.matches('input') ? box : box.querySelector('input, textarea, button'); if (inp) inp.focus({ preventScroll: true }); box.scrollIntoView({ block: 'center' }); }
  }

  /* ---------- images ---------- */
  function readImage(file, max, done, fail) {
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function () {
      try {
        var sc = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
        var w = Math.max(1, Math.round(img.naturalWidth * sc)), hh = Math.max(1, Math.round(img.naturalHeight * sc));
        var c = document.createElement('canvas'); c.width = w; c.height = hh;
        var x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, w, hh); x.drawImage(img, 0, 0, w, hh);
        var d = c.toDataURL('image/jpeg', 0.86); URL.revokeObjectURL(url);
        done({ preview: d, data: d.split(',')[1], mime: 'image/jpeg' });
      } catch (e) { URL.revokeObjectURL(url); fail(); }
    };
    img.onerror = function () { URL.revokeObjectURL(url); fail(); };
    img.src = url;
  }

  /* ---------- removing an offer ---------- */
  function removeOffer(idx) {
    for (var i = idx; i <= S.offers; i++) OFFER_SFX.forEach(function (s) {
      var from = 'o' + (i + 1) + s, to = 'o' + i + s;
      if (i < S.offers) S.a[to] = S.a[from]; else delete S.a[to];
    });
    S.offers--;
  }

  /* ---------- sending ---------- */
  function payload() {
    var A = {}, i;
    var put = function (k, v) { A[k] = Array.isArray(v) ? v.join('; ') : String(v == null ? '' : v).trim(); };
    ['how', 'skool', 'name', 'email', 'business', 'bdate', 'btime', 'bunsure', 'bplace'].concat(STEPS[1].keys, STEPS[2].keys, STEPS[4].keys, STEPS[5].keys).forEach(function (k) { put(k, val(k)); });
    for (i = 1; i <= 3; i++) OFFER_SFX.forEach(function (s) { put('o' + i + s, i <= S.offers ? val('o' + i + s) : ''); });
    ['cname', 'clink', 'caccess', 'ccost', 'cmembers', 'cactive', 'cpath', 'cheavy', 'cinvite'].forEach(function (k) { put(k, shown(k) ? val(k) : ''); });
    A.formState = JSON.stringify({ offers: S.offers });
    return A;
  }
  function submit() {
    S.sending = true; S.formError = ''; render(false);
    var images = {};
    IMAGE_KEYS.forEach(function (k) {
      if (!shown(k)) { if (S.token && S.existing[k]) images[k] = null; return; }
      if (S.images[k] === null) images[k] = null;
      else if (S.images[k] && S.images[k].data) images[k] = { data: S.images[k].data, mime: S.images[k].mime };
    });
    var hp = document.getElementById('hpField');
    var body = { answers: payload(), images: images, consent: S.consent === true, token: S.token, hp: hp ? hp.value : '' };
    if (!LIVE) { S.sending = false; window.__lastPayload = body; clearDraft(); renderDone({ editLink: 'preview', emailed: true }); return; }
    fetch(SCRIPT_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) })
      .then(function (r) { return r.json(); })
      .then(function (res) { S.sending = false; if (!res || !res.ok) throw new Error((res && res.error) || 'failed'); clearDraft(); renderDone(res); })
      .catch(function () {
        S.sending = false;
        S.formError = 'That didn\'t go through, but your answers are still here. Please try again. If it keeps happening, email team@aurailia.com.';
        render(false); var e = document.querySelector('.form-error'); if (e) e.scrollIntoView({ block: 'center' });
      });
  }
  /* bring saved answers back into the form */
  function unpack(ans, imgs) {
    var st = {}; try { st = JSON.parse(ans.formState || '{}'); } catch (e) { st = {}; }
    var a = {}, i;
    Object.keys(F).forEach(function (k) { if (F[k].type !== 'image') a[k] = ans[k] || ''; });
    a.sources = SOURCES.filter(function (o) { return String(ans.sources || '').split(/\s*;\s*/).indexOf(o) !== -1; });
    var offers = 0; for (i = 1; i <= 3; i++) if (a['o' + i + 'title']) offers = i;
    S.existing = imgs || {};
    S.a = a; S.offers = st.offers != null ? Math.min(Math.max(+st.offers || 0, offers), 3) : offers;
  }

  /* ---------- events ---------- */
  app.addEventListener('input', function (e) {
    if (e.target.id === 'aiPaste') { S.aiText = e.target.value; return; }
    var k = e.target.getAttribute('data-a'); if (!k) return;
    S.a[k] = e.target.value;
    var c = app.querySelector('[data-count="' + k + '"]'); if (c) c.textContent = e.target.value.length + ' / ' + F[k].max;
    saveDraft();
  });
  app.addEventListener('change', function (e) {
    if (e.target.id === 'consent') {
      S.consent = e.target.checked;
      if (e.target.checked && S.errors.consent) { delete S.errors.consent; var row = e.target.closest('.field'); if (row) { row.classList.remove('invalid'); var m = row.querySelector('.err'); if (m) m.parentNode.removeChild(m); } }
      return;
    }
    var ck = e.target.getAttribute('data-check');
    if (ck) { S.a[ck] = e.target.checked ? 'Yes' : ''; if (ck === 'bunsure') delete S.errors.btime; saveDraft(); var y3 = window.pageYOffset; render(false); window.scrollTo(0, y3); return; }
    var k = e.target.getAttribute('data-image');
    if (!k || !e.target.files || !e.target.files[0]) return;
    S.busy++; delete S.errors[k]; render(false);
    readImage(e.target.files[0], F[k].size || 1400, function (img) { S.images[k] = img; S.busy--; render(false); }, function () { S.busy--; S.errors[k] = 'I couldn\'t open that image. Please try a JPG or PNG.'; render(false); });
  });
  app.addEventListener('click', function (e) {
    var t = e.target.closest ? e.target.closest('button') : null;
    if (!t) return;
    if (t.id === 'aiToggle') { S.aiOpen = true; render(false); var bx = app.querySelector('.ai-box'); if (bx) bx.scrollIntoView({ block: 'start' }); return; }
    if (t.id === 'aiCopy') {
      copyText(promptText(), function () { S.aiCopied = true; S.aiShowPrompt = false; var y0 = window.pageYOffset; render(false); window.scrollTo(0, y0); },
        function () { S.aiShowPrompt = true; S.aiNote = 'Copy the prompt from the box above.'; S.aiBad = false; var y1 = window.pageYOffset; render(false); window.scrollTo(0, y1); var pb = document.getElementById('aiPromptBox'); if (pb) { pb.focus(); pb.select(); } });
      return;
    }
    if (t.id === 'aiFill') {
      var pj = pickJson(S.aiText);
      if (!pj) { S.aiBad = true; S.aiNote = 'I couldn\'t read that. Paste the whole answer, including the part in curly brackets.'; }
      else {
        var got = aiFill(pj); saveDraft();
        S.aiBad = !got;
        S.aiNote = got ? 'Done. I filled in ' + got + ' answers. Add your birth details below, then tap Next to check each step and make sure it sounds like you.' : 'That answer was empty. Tell the AI more about your business and try again.';
      }
      var y2 = window.pageYOffset; render(false); window.scrollTo(0, y2);
      return;
    }
    var pk = t.getAttribute('data-pick');
    if (pk) {
      var f = F[pk], v = t.getAttribute('data-v');
      if (f.type !== 'multi') S.a[pk] = v;
      else {
        var list = Array.isArray(S.a[pk]) ? S.a[pk].slice() : [];
        var at = list.indexOf(v);
        if (at !== -1) list.splice(at, 1);
        else if (f.maxPick && list.length >= f.maxPick) { S.errors[pk] = 'You can pick up to ' + f.maxPick + '. Tap one to unpick it first.'; render(false); return; }
        else list.push(v);
        S.a[pk] = list;
      }
      delete S.errors[pk];
      saveDraft();
      var y = window.pageYOffset; render(false); window.scrollTo(0, y);
      return;
    }
    if (t.id === 'backBtn') { S.aiOpen = false; S.aiNote = ''; S.aiText = ''; S.aiCopied = false; S.errors = {}; S.formError = ''; S.step--; saveDraft(); render(true); return; }
    if (t.getAttribute('data-add')) { S.offers++; S.confirmRemove = ''; saveDraft(); render(false); return; }
    var rem = t.getAttribute('data-remove');
    if (rem) {
      if (S.confirmRemove !== rem) { S.confirmRemove = rem; render(false); return; }
      S.confirmRemove = ''; S.errors = {}; removeOffer(+rem.slice(1)); saveDraft(); render(false); return;
    }
    var go = t.getAttribute('data-goto');
    if (go !== null) { S.errors = {}; S.formError = ''; S.step = +go; saveDraft(); render(true); return; }
    var rp = t.getAttribute('data-replace');
    if (rp) { var inp = app.querySelector('[data-image="' + rp + '"]'); if (inp) inp.click(); return; }
    var cl = t.getAttribute('data-clear');
    if (cl) { if (S.existing[cl]) { S.images[cl] = null; S.existing[cl] = ''; } else delete S.images[cl]; render(false); }
  });
  app.addEventListener('submit', function (e) {
    e.preventDefault();
    if (S.sending || S.busy) return;
    var errs = validate();
    if (Object.keys(errs).length) { showErrors(errs); return; }
    S.errors = {}; S.formError = '';
    if (S.step === STEPS.length - 1) { submit(); return; }
    S.aiOpen = false; S.aiNote = ''; S.aiText = ''; S.aiCopied = false; S.confirmRemove = '';
    S.step++; saveDraft(); render(true);
  });

  /* ---------- start ---------- */
  document.getElementById('previewNote').hidden = LIVE;
  var token = '';
  try { token = new URLSearchParams(location.search).get('edit') || ''; } catch (e) { token = ''; }
  if (token && LIVE) {
    app.innerHTML = '<div class="center-msg">Getting your answers...</div>';
    fetch(SCRIPT_URL + '?action=load&token=' + encodeURIComponent(token))
      .then(function (r) { return r.json(); })
      .then(function (res) { if (!res || !res.ok) throw new Error('nf'); S.token = token; unpack(res.answers || {}, res.images || {}); render(true); })
      .catch(function () { app.innerHTML = '<div class="center-msg">I couldn\'t find your answers with that link. Please email team@aurailia.com and I\'ll help you.</div>'; });
  } else {
    loadDraft();
    render(false);
  }
  window.__auditForm = { unpack: unpack, payload: payload, aiFill: aiFill, S: S };
})();
</script>
